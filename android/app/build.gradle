plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.spokenmaterial.app'
    compileSdk 35
    defaultConfig {
        applicationId 'com.spokenmaterial.app'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    sourceSets.main.assets.srcDir file('../../web')
    packaging { jniLibs.useLegacyPackaging = true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version '3.12'
        if (System.getenv('ANDROID_BUILD_PYTHON')) {
            buildPython System.getenv('ANDROID_BUILD_PYTHON')
        }
        pip {
            install 'Pillow==11.0.0'
            install 'yt-dlp==2026.10.26'
            install 'yt-dlp-ejs==0.8.0'
            install 'certifi'
        }
    }
    sourceSets {
        getByName('main') { srcDir file("$buildDir/generated/shared-python") }
    }
}

def syncSharedSource = tasks.register('syncSharedSource', Copy) {
    from '../../app.py'
    into layout.buildDirectory.dir('generated/shared-python')
}
tasks.configureEach { task ->
    if (task.name.toLowerCase().contains('python')) {
        task.dependsOn(syncSharedSource)
    }
}

dependencies {
    implementation 'androidx.core:core:1.8.0'
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
}
